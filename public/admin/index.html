<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — GridLab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<div class="admin-shell">
  <aside class="admin-sidebar">
    <div class="admin-logo">GridLab Admin</div>
    <nav class="admin-nav" id="admin-nav">
      <a href="#settings" data-tab="settings">Site Settings</a>
      <a href="#categories" data-tab="categories">Categories</a>
      <a href="#pages" data-tab="pages">Studio Pages</a>
      <a href="#ventures" data-tab="ventures">Ventures</a>
      <a href="#products" data-tab="products">Products</a>
      <a href="#hire-requests" data-tab="hire-requests">Hire Requests</a>
      <a href="#account" data-tab="account">Account</a>
    </nav>
    <div class="admin-sidebar-bottom">
      <a href="../index.html" target="_blank" rel="noopener">View site &rarr;</a>
      <button class="btn" id="logout-btn" type="button">Log out</button>
    </div>
  </aside>

  <main class="admin-main">
    <div id="panel-settings" class="admin-panel"></div>
    <div id="panel-categories" class="admin-panel"></div>
    <div id="panel-pages" class="admin-panel"></div>
    <div id="panel-ventures" class="admin-panel"></div>
    <div id="panel-products" class="admin-panel"></div>
    <div id="panel-hire-requests" class="admin-panel"></div>
    <div id="panel-account" class="admin-panel"></div>
  </main>
</div>

<div class="admin-toast" id="admin-toast"></div>

<script src="admin.js"></script>
</body>
</html>
